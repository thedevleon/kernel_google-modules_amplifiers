description: Cirrus Logic CS40L26 Boosted Haptic Amplifier

compatible: "cirrus,cs40l26"

include: [spi-device.yaml]

properties:
  reset-gpios:
    type: phandle-array
    description: Reset GPIO pin
    
  irq-gpios:
    type: phandle-array
    description: Interrupt GPIO pin
    
  devid:
    type: int
    description: Device ID (0x40A260 for CS40L26A, 0x40A26B for CS40L26B)
    default: 0x40A260
